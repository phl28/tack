# tack config. Sourced as bash. Lives at the root of YOUR config directory
# (~/.config/tack by default), which is the thing you commit and sync between
# machines -- not the tool repo.
#
# Layout this expects:
#   tack.conf        this file
#   core/               everything portable: skills, commands, agents, bin, hooks
#   harnesses/          your harness plugins -- tack ships none of its own
#   local/              gitignored: secrets.env, profile, machine-only plugins

# Where your portable content lives.
CORE="$TACK_HOME/core"

# Default profile when neither $TACK_PROFILE nor local/profile is set.
# Entries whose frontmatter says `profiles: [work]` link only under profile work;
# entries that say nothing link everywhere.
PROFILE="personal"

# KEY=value file, never committed. ${KEY} in core/mcp.json resolves from it.
SECRETS_FILE="$TACK_HOME/local/secrets.env"

# Extra directories to search for harness plugins. $TACK_HOME/harnesses and
# $TACK_HOME/local/harnesses are always searched, in that order; later wins, so
# a machine-local plugin shadows a committed one of the same name. Add shared or
# team plugin directories here.
HARNESS_DIRS=()
